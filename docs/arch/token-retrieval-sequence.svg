<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 1530" role="img" aria-labelledby="token-title token-desc">
  <title id="token-title">Token retrieval sequence: cache or shared refresh</title>
  <desc id="token-desc">The mediator returns usable cached access credentials or coordinates a refresh. A leader rechecks state, commits a claim before the provider request, then conditionally saves or discards the connection. Concurrent requests for the same session and provider share the operation.</desc>
  <defs>
    <marker id="token-sync" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2 1 L12 7 L2 13 Z" fill="black" />
    </marker>
    <marker id="token-async" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2 1 L12 7 L2 13" fill="none" stroke="black" stroke-width="1.7" />
    </marker>
    <marker id="token-reply" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2 1 L12 7 L2 13" fill="none" stroke="black" stroke-width="1.7" />
    </marker>
  </defs>
  <rect width="1550" height="1530" fill="white" />
  <g font-family="DejaVu Sans, sans-serif" fill="black">
    <text x="775" y="45" text-anchor="middle" font-size="31" font-weight="bold">Token retrieval: cache or shared refresh</text>
    <text x="775" y="80" text-anchor="middle" font-size="18">Time runs downward · solid filled: synchronous call · solid open: asynchronous · dashed open: reply</text>

    <rect x="65" y="115" width="210" height="62" fill="white" stroke="black" stroke-width="2" />
    <rect x="390" y="115" width="260" height="62" fill="white" stroke="black" stroke-width="2" />
    <rect x="770" y="115" width="260" height="62" fill="white" stroke="black" stroke-width="2" />
    <rect x="1240" y="115" width="220" height="62" fill="white" stroke="black" stroke-width="2" />
    <text x="170" y="140" text-anchor="middle" font-size="16">«external»</text>
    <text x="170" y="164" text-anchor="middle" font-size="22" font-weight="bold">Browser</text>
    <text x="520" y="140" text-anchor="middle" font-size="16">«component»</text>
    <text x="520" y="164" text-anchor="middle" font-size="22" font-weight="bold" fill="#1856a6">mediator.Server</text>
    <text x="900" y="140" text-anchor="middle" font-size="16">«component»</text>
    <text x="900" y="164" text-anchor="middle" font-size="22" font-weight="bold" fill="#18713a">session.Store</text>
    <text x="1350" y="140" text-anchor="middle" font-size="16">«external»</text>
    <text x="1350" y="164" text-anchor="middle" font-size="22" font-weight="bold" fill="#7435a0">Provider</text>

    <path d="M170 177 V1450 M520 177 V1450 M900 177 V1450 M1350 177 V1450" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="8 7" />

    <path d="M170 220 H520" fill="none" stroke="black" stroke-width="2" marker-end="url(#token-sync)" />
    <text x="345" y="209" text-anchor="middle" font-size="18">POST /oauth/{provider}/token</text>

    <path d="M520 280 H900" fill="none" stroke="black" stroke-width="2" marker-end="url(#token-sync)" />
    <text x="710" y="269" text-anchor="middle" font-size="18">LoadConnection(cookie, provider)</text>

    <path d="M900 330 H520" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#token-reply)" />
    <text x="710" y="319" text-anchor="middle" font-size="18">Credentials + revision reference</text>

    <rect x="55" y="365" width="1440" height="1055" fill="none" stroke="black" stroke-width="2" />
    <path d="M55 405 H1495" fill="none" stroke="black" stroke-width="2" />
    <rect x="55" y="365" width="62" height="40" fill="white" stroke="black" stroke-width="2" />
    <text x="86" y="392" text-anchor="middle" font-size="18" font-weight="bold">alt</text>

    <rect x="135" y="407" width="450" height="23" fill="white" />
    <text x="140" y="425" font-size="17">[expiry unknown or more than two minutes remain]</text>
    <path d="M520 460 H170" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#token-reply)" />
    <rect x="165" y="431" width="360" height="24" fill="white" />
    <text x="345" y="449" text-anchor="middle" font-size="18">Return cached access token; no write</text>

    <path d="M55 480 H1495" fill="none" stroke="black" stroke-width="2" />
    <rect x="135" y="492" width="490" height="23" fill="white" />
    <text x="140" y="510" font-size="17">[near expiry with usable refresh token, or joining a flight]</text>
    <rect x="975" y="492" width="440" height="23" fill="white" />
    <text x="980" y="510" font-size="16" fill="#b36313">No usable refresh: keep valid access; discard expired.</text>

    <path d="M520 555 H900" fill="none" stroke="black" stroke-width="2" marker-end="url(#token-sync)" />
    <text x="710" y="544" text-anchor="middle" font-size="18">CoordinateRefresh(ref, callback)</text>

    <path d="M900 605 H520" fill="none" stroke="black" stroke-width="2" marker-end="url(#token-sync)" />
    <rect x="505" y="576" width="415" height="24" fill="white" />
    <text x="710" y="594" text-anchor="middle" font-size="18">Run leader callback outside coordinator lock</text>

    <path d="M520 660 H900" fill="none" stroke="black" stroke-width="2" marker-end="url(#token-sync)" />
    <text x="710" y="649" text-anchor="middle" font-size="18">Recheck current connection</text>

    <path d="M900 710 H520" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#token-reply)" />
    <text x="710" y="699" text-anchor="middle" font-size="18">Current credentials + revision</text>

    <path d="M520 760 H900" fill="none" stroke="black" stroke-width="2" marker-end="url(#token-sync)" />
    <text x="710" y="749" text-anchor="middle" font-size="18">ClaimRefresh(reference)</text>

    <path d="M900 810 H520" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#token-reply)" />
    <rect x="470" y="781" width="480" height="24" fill="white" />
    <text x="710" y="799" text-anchor="middle" font-size="18">Committed marker + claim; credentials unavailable</text>

    <path d="M520 865 H1350" fill="none" stroke="black" stroke-width="2" marker-end="url(#token-sync)" />
    <rect x="700" y="836" width="470" height="24" fill="white" />
    <text x="935" y="854" text-anchor="middle" font-size="18">Refresh request · outside SQL transaction and lock</text>

    <path d="M1350 920 H520" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#token-reply)" />
    <rect x="695" y="891" width="480" height="24" fill="white" />
    <text x="935" y="909" text-anchor="middle" font-size="18">Success, known rejection, or uncertain consumption</text>

    <rect x="95" y="950" width="1360" height="250" fill="none" stroke="black" stroke-width="2" />
    <path d="M95 990 H1455" fill="none" stroke="black" stroke-width="2" />
    <rect x="95" y="950" width="62" height="40" fill="white" stroke="black" stroke-width="2" />
    <text x="126" y="977" text-anchor="middle" font-size="18" font-weight="bold">alt</text>
    <rect x="170" y="1002" width="185" height="23" fill="white" />
    <text x="175" y="1020" font-size="17">[successful refresh]</text>
    <path d="M520 1052 H900" fill="none" stroke="black" stroke-width="2" marker-end="url(#token-sync)" />
    <rect x="505" y="1023" width="410" height="24" fill="white" />
    <text x="710" y="1041" text-anchor="middle" font-size="18">FinishRefresh: guarded save + clear marker</text>
    <path d="M900 1080 H520" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#token-reply)" />
    <text x="710" y="1069" text-anchor="middle" font-size="17">Committed</text>
    <path d="M95 1095 H1455" fill="none" stroke="black" stroke-width="2" />
    <rect x="170" y="1096" width="550" height="23" fill="white" />
    <text x="175" y="1114" font-size="17">[uncertain consumption, invalid_grant, or bad_refresh_token]</text>
    <path d="M520 1160 H900" fill="none" stroke="black" stroke-width="2" marker-end="url(#token-sync)" />
    <rect x="430" y="1131" width="560" height="24" fill="white" />
    <text x="710" y="1149" text-anchor="middle" font-size="18" fill="#a12d2d">DiscardConnection: do not reuse a possibly consumed token</text>
    <path d="M900 1185 H520" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#token-reply)" />
    <text x="710" y="1174" text-anchor="middle" font-size="17">Discarded</text>

    <path d="M520 1235 H900" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#token-reply)" />
    <text x="710" y="1224" text-anchor="middle" font-size="18">Return callback outcome</text>

    <path d="M900 1275 H520" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#token-reply)" />
    <text x="710" y="1264" text-anchor="middle" font-size="18">Shared flight result</text>

    <path d="M520 1315 H900" fill="none" stroke="black" stroke-width="2" marker-end="url(#token-sync)" />
    <text x="710" y="1304" text-anchor="middle" font-size="18">Reload using this caller's cookie</text>

    <path d="M900 1355 H520" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#token-reply)" />
    <text x="710" y="1344" text-anchor="middle" font-size="18">Current credentials or missing connection</text>

    <path d="M520 1395 H170" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#token-reply)" />
    <text x="345" y="1384" text-anchor="middle" font-size="18">Access token or sanitized error</text>

    <rect x="230" y="1442" width="1090" height="23" fill="white" />
    <text x="775" y="1460" text-anchor="middle" font-size="17" fill="#a12d2d">Uncertain outcomes discard the connection. A failed final write leaves the marker; startup deletes that unfinished connection.</text>
    <text x="775" y="1490" text-anchor="middle" font-size="16">Waiters may cancel independently; no exhaustive provider-error taxonomy is shown.</text>
  </g>
</svg>
