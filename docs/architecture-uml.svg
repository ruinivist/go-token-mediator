<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc"><title id="title">Token mediator: SQL ownership</title><desc id="desc">Server calls a concrete SQL store. Sessions own pending authorization and provider connections; the store also owns a credential-free refresh coordinator.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24364b" stroke-width="1.5"/></marker></defs><rect width="1200" height="1000" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#15283c"><text x="600" y="42" text-anchor="middle" font-size="26" font-weight="bold">Token mediator: SQL ownership</text>
<rect x="35" y="90" width="535" height="172" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M35 133 H570" stroke="#24364b"/>
<text x="302.5" y="119" font-size="20" text-anchor="middle">mediator.Server</text>
<text x="51" y="160" font-size="17" text-anchor="start">Config + ProviderConfig + rateLimiter</text>
<text x="51" y="188" font-size="17" text-anchor="start">Browser validation and OAuth policy</text>
<text x="51" y="216" font-size="17" text-anchor="start">Provider calls outside SQL transactions</text>
<text x="51" y="244" font-size="17" text-anchor="start">Wait for HTTP handlers before returning</text>
<rect x="635" y="90" width="530" height="172" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M635 133 H1165" stroke="#24364b"/>
<text x="900.0" y="119" font-size="20" text-anchor="middle">session.Store</text>
<text x="651" y="160" font-size="17" text-anchor="start">One database/sql connection; exclusive owner</text>
<text x="651" y="188" font-size="17" text-anchor="start">BeginAuth / ConsumeAuth / CompleteAuth</text>
<text x="651" y="216" font-size="17" text-anchor="start">LoadConnection / ClaimRefresh / FinishRefresh</text>
<text x="651" y="244" font-size="17" text-anchor="start">DiscardConnection / Logout / CleanupExpired</text>
<path d="M570 180 L635 180" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="602.5" y="170.0" font-size="16" text-anchor="middle">calls</text>
<rect x="35" y="420" width="335" height="144" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M35 463 H370" stroke="#24364b"/>
<text x="202.5" y="449" font-size="20" text-anchor="middle">SQL sessions</text>
<text x="51" y="490" font-size="17" text-anchor="start">id: never-reused internal key</text>
<text x="51" y="518" font-size="17" text-anchor="start">cookie: unique opaque ID</text>
<text x="51" y="546" font-size="17" text-anchor="start">expires_at: absolute deadline</text>
<rect x="435" y="420" width="335" height="144" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M435 463 H770" stroke="#24364b"/>
<text x="602.5" y="449" font-size="20" text-anchor="middle">SQL pending_auth</text>
<text x="451" y="490" font-size="17" text-anchor="start">session_id: foreign key</text>
<text x="451" y="518" font-size="17" text-anchor="start">provider / state / verifier</text>
<text x="451" y="546" font-size="17" text-anchor="start">created_at: store-owned time</text>
<rect x="835" y="420" width="330" height="144" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M835 463 H1165" stroke="#24364b"/>
<text x="1000.0" y="449" font-size="20" text-anchor="middle">SQL connections</text>
<text x="851" y="490" font-size="17" text-anchor="start">id / session_id / provider</text>
<text x="851" y="518" font-size="17" text-anchor="start">credentials / scopes / deadlines</text>
<text x="851" y="546" font-size="17" text-anchor="start">revision / refreshing marker</text>
<path d="M820 262 L200 420" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="510.0" y="331.0" font-size="16" text-anchor="middle">owns SQL transactions</text>
<path d="M370 500 L435 500" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="402.5" y="490.0" font-size="16" text-anchor="middle">0..1</text>
<path d="M200 564 L200 625" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M200 625 L1000 625" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="615.0" font-size="16" text-anchor="middle">session_id: cascading ownership, 0..* connections</text>
<path d="M1000 625 L1000 564" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="35" y="725" width="535" height="172" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M35 768 H570" stroke="#24364b"/>
<text x="302.5" y="754" font-size="20" text-anchor="middle">Opaque values across the package boundary</text>
<text x="51" y="795" font-size="17" text-anchor="start">BrowserSession: cookie ID + expiry</text>
<text x="51" y="823" font-size="17" text-anchor="start">AuthHandle: original session + cookie + provider</text>
<text x="51" y="851" font-size="17" text-anchor="start">ConnectionRef: row identity + revision</text>
<text x="51" y="879" font-size="17" text-anchor="start">RefreshClaim: committed refresh reference</text>
<rect x="635" y="725" width="530" height="172" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M635 768 H1165" stroke="#24364b"/>
<text x="900.0" y="754" font-size="20" text-anchor="middle">Refresh coordinator</text>
<text x="651" y="795" font-size="17" text-anchor="start">Key: stable session identity + provider</text>
<text x="651" y="823" font-size="17" text-anchor="start">Completion channels and shared errors</text>
<text x="651" y="851" font-size="17" text-anchor="start">No credentials; no SQL transaction</text>
<text x="651" y="879" font-size="17" text-anchor="start">Cookie rotation preserves the key</text>
<path d="M1165 180 H1180 V690 H900 V725" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1030" y="680" font-size="16" text-anchor="middle">owns coordinator</text>
</g></svg>
