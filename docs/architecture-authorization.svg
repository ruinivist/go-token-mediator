<text x="1225" y="1838" font-size="19" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">Lock: save + rotate ID; keep</text>
<text x="1225" y="1863" font-size="19" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">deadline; unlock</text>
<path d="M1110 1940 H650" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/>
<text x="880.0" y="1922" font-size="19" fill="black" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">New ID; original session deadline</text>
<path d="M650 2052 H170" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/>
<text x="410.0" y="2034" font-size="19" fill="black" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">303 frontend completion; rotated cookie</text>
<path d="M170 2164 H650" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)"/>
<text x="410.0" y="2146" font-size="19" fill="black" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">POST /oauth/{provider}/token</text>
<path d="M650 2276 H170" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/>
<text x="410.0" y="2258" font-size="19" fill="black" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">Access token for browser API calls</text>
<text x="900.0" y="2414" font-size="18" fill="black" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">Time runs downward. Solid filled arrow: call; dashed open arrow: reply. Lock labels mark critical sections.</text>
</g></svg>
