<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1131" viewBox="0 0 1200 1131" role="img" aria-labelledby="title desc"><title id="title">Authorization: consume, exchange, rotate</title><desc id="desc">Time runs downward. Invalid or replayed callbacks never reach the provider. Completion rejects logout, expiry, provider mismatch, and obsolete cookies.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24364b" stroke-width="1.5"/></marker></defs><rect width="1200" height="1131" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#15283c"><text x="600" y="42" text-anchor="middle" font-size="26" font-weight="bold">Authorization: consume, exchange, rotate</text>
<text x="70.0" y="95" font-size="18" text-anchor="middle">Browser</text>
<path d="M70.0 115 V1000" stroke="#a5b2bf" stroke-dasharray="5 5"/>
<text x="423.3333333333333" y="95" font-size="18" text-anchor="middle">Mediator</text>
<path d="M423.3333333333333 115 V1000" stroke="#a5b2bf" stroke-dasharray="5 5"/>
<text x="776.6666666666666" y="95" font-size="18" text-anchor="middle">SQLite store</text>
<path d="M776.6666666666666 115 V1000" stroke="#a5b2bf" stroke-dasharray="5 5"/>
<text x="1130.0" y="95" font-size="18" text-anchor="middle">Provider</text>
<path d="M1130.0 115 V1000" stroke="#a5b2bf" stroke-dasharray="5 5"/>
<path d="M70.0 155 L423.3333333333333 155" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="246.66666666666666" y="145.0" font-size="16" text-anchor="middle">POST start; exact origin + CSRF header + {}</text>
<text x="423.3333333333333" y="205" font-size="15" text-anchor="middle">Generate state and PKCE material</text>
<path d="M423.3333333333333 271 L776.6666666666666 271" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="261.0" font-size="16" text-anchor="middle">BeginAuth: reuse/create + replace pending</text>
<path d="M776.6666666666666 329 L423.3333333333333 329" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="319.0" font-size="16" text-anchor="middle">BrowserSession: cookie + absolute deadline</text>
<path d="M423.3333333333333 387 L70.0 387" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="246.66666666666666" y="377.0" font-size="16" text-anchor="middle">authorization_url + protected cookie</text>
<path d="M70.0 445 L1130.0 445" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="435.0" font-size="16" text-anchor="middle">Navigate with state + S256 challenge</text>
<path d="M1130.0 503 L70.0 503" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="493.0" font-size="16" text-anchor="middle">Redirect with code + state</text>
<path d="M70.0 561 L423.3333333333333 561" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="246.66666666666666" y="551.0" font-size="16" text-anchor="middle">GET callback with cookie</text>
<path d="M423.3333333333333 619 L776.6666666666666 619" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="609.0" font-size="16" text-anchor="middle">ConsumeAuth: validate + delete pending</text>
<path d="M776.6666666666666 677 L423.3333333333333 677" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="667.0" font-size="16" text-anchor="middle">Verifier + opaque AuthHandle</text>
<path d="M423.3333333333333 735 L1130.0 735" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="776.6666666666666" y="725.0" font-size="16" text-anchor="middle">Exchange code outside SQL transaction</text>
<path d="M1130.0 793 L423.3333333333333 793" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="776.6666666666666" y="783.0" font-size="16" text-anchor="middle">Validated token response</text>
<path d="M423.3333333333333 851 L776.6666666666666 851" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="841.0" font-size="16" text-anchor="middle">CompleteAuth: save + rotate atomically</text>
<path d="M776.6666666666666 909 L423.3333333333333 909" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="899.0" font-size="16" text-anchor="middle">Rotated BrowserSession; original deadline</text>
<path d="M423.3333333333333 967 L70.0 967" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="246.66666666666666" y="957.0" font-size="16" text-anchor="middle">303 frontend completion + rotated cookie</text>
<text x="600" y="1040" font-size="16" text-anchor="middle">Invalid or replayed callbacks never reach the provider.</text>
<text x="600" y="1068" font-size="16" text-anchor="middle">Completion rejects logout, expiry, provider mismatch, and obsolete cookies.</text>
</g></svg>
