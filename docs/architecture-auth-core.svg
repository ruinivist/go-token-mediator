<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Part 2: authorization transactions</title><desc id="desc">The mediator exchanges a code between consuming authorization and atomically saving and rotating its session cookie.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24364b" stroke-width="1.5"/></marker></defs><rect width="1200" height="610" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#15283c"><text x="600" y="42" text-anchor="middle" font-size="26" font-weight="bold">Part 2: authorization transactions</text>
<rect x="35" y="100" width="530" height="144" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M35 143 H565" stroke="#24364b"/>
<text x="300.0" y="129" font-size="20" text-anchor="middle">mediator.Server + ProviderConfig</text>
<text x="51" y="170" font-size="17" text-anchor="start">Generate state, verifier, challenge</text>
<text x="51" y="198" font-size="17" text-anchor="start">Build provider URL and exchange code</text>
<text x="51" y="226" font-size="17" text-anchor="start">Never send verifier or refresh token to browser</text>
<rect x="650" y="100" width="515" height="144" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M650 143 H1165" stroke="#24364b"/>
<text x="907.5" y="129" font-size="20" text-anchor="middle">session.Store</text>
<text x="666" y="170" font-size="17" text-anchor="start">BeginAuth(ctx, cookie, pending)</text>
<text x="666" y="198" font-size="17" text-anchor="start">ConsumeAuth(ctx, cookie, provider, state)</text>
<text x="666" y="226" font-size="17" text-anchor="start">CompleteAuth(ctx, handle, connection)</text>
<path d="M565 190 L650 190" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="607.5" y="180.0" font-size="16" text-anchor="middle">calls</text>
<rect x="180" y="390" width="840" height="172" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M180 433 H1020" stroke="#24364b"/>
<text x="600.0" y="419" font-size="20" text-anchor="middle">Opaque authorization handle</text>
<text x="196" y="460" font-size="17" text-anchor="start">Bound to original session identity, cookie, and provider</text>
<text x="196" y="488" font-size="17" text-anchor="start">Completion saves connection + rotates cookie in one transaction</text>
<text x="196" y="516" font-size="17" text-anchor="start">Other providers and the original deadline survive</text>
<text x="196" y="544" font-size="17" text-anchor="start">Consumed attempts cannot be replayed after failure</text>
<path d="M900 244 L900 390" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="900.0" y="307.0" font-size="16" text-anchor="middle">returns / validates</text>
</g></svg>
