<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" role="img" aria-labelledby="title"><title id="title">Part 2: establish a provider connection</title>
<defs>
<marker id="open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="1.5"/></marker>
<marker id="filled" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12 Z" fill="black"/></marker>
</defs>
<rect width="1500" height="1100" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="black">
<text x="750.0" y="43" font-size="31" fill="black" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">Part 2: establish a provider connection</text>
<text x="750.0" y="79" font-size="20" fill="black" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">Blue: logic    Green: state    Purple: contracts    Black: UML relationships</text>
<rect x="50" y="130" width="650" height="140" fill="white" stroke="black" stroke-width="2"/>
<text x="375.0" y="165" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">mediator.Server</text>
<path d="M50 182 H700" fill="none" stroke="black" stroke-width="2"/>
<path d="M50 192 H700" fill="none" stroke="black" stroke-width="2"/>
<text x="68" y="222" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">~ providerOAuthStart(w, r)</text>
<text x="68" y="252" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">~ providerOAuthCallback(w, r)</text>
<rect x="850" y="130" width="600" height="200" fill="white" stroke="black" stroke-width="2"/>
<text x="1150.0" y="165" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">mediator.ProviderConfig</text>
<path d="M850 182 H1450" fill="none" stroke="black" stroke-width="2"/>
<text x="868" y="212" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">+ AuthUrl, TokenUrl: string</text>
<text x="868" y="242" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">+ ClientId, ClientSecret: string</text>
<path d="M850 252 H1450" fill="none" stroke="black" stroke-width="2"/>
<text x="868" y="282" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">~ buildAuthUrl(state, challenge)</text>
<text x="868" y="312" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">~ fetchAccessToken(code, verifier, ctx)</text>
<path d="M700 220 H850" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/>
<text x="775" y="202" font-size="18" fill="black" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">uses</text>
<rect x="50" y="500" width="650" height="170" fill="white" stroke="black" stroke-width="2"/>
<text x="375.0" y="535" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">session.Store</text>
<path d="M50 552 H700" fill="none" stroke="black" stroke-width="2"/>
<path d="M50 562 H700" fill="none" stroke="black" stroke-width="2"/>
<text x="68" y="592" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">+ SetPendingAuth(id, pending)</text>
<text x="68" y="622" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">+ ConsumePendingAuth(id, provider, state)</text>
<text x="68" y="652" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">+ CompleteAuth(id, connection)</text>
<path d="M375 270 V500" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)"/>
<text x="395" y="395" font-size="18" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">store: 1</text>
<path d="M850 510 H1430 L1450 530 V654 H850 Z M1430 510 V530 H1450" fill="white" stroke="black" stroke-width="2"/>
<text x="866" y="542" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">1. Save provider, state, verifier, start time.</text>
<text x="866" y="572" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">2. Consume valid attempt under lock.</text>
<text x="866" y="602" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">3. Exchange code outside lock.</text>
<text x="866" y="632" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">4. Save + rotate ID under lock.</text>
<path d="M700 570 H850" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<path d="M110 825 H1370 L1390 845 V939 H110 Z M1370 825 V845 H1390" fill="white" stroke="black" stroke-width="2"/>
<text x="126" y="857" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">The authorization URL carries the challenge; the verifier stays on the backend.</text>
<text x="126" y="887" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">Completion keeps other connections and the original deadline. Old session ID stops working.</text>
<text x="126" y="917" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">A consumed attempt cannot be replayed, including after an exchange failure.</text>
</g></svg>
