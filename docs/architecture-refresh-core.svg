<rect x="850" y="130" width="600" height="140" fill="white" stroke="black" stroke-width="2"/>
<text x="1150.0" y="165" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">session.Store</text>
<path d="M850 182 H1450" fill="none" stroke="black" stroke-width="2"/>
<text x="868" y="212" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">~ mtx: sync.RWMutex</text>
