<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Part 3: refresh coordination and SQL claims</title><desc id="desc">The coordinator shares completion signals, while SQL claims prevent reusing or overwriting stale credentials.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24364b" stroke-width="1.5"/></marker></defs><rect width="1200" height="720" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#15283c"><text x="600" y="42" text-anchor="middle" font-size="26" font-weight="bold">Part 3: refresh coordination and SQL claims</text>
<rect x="35" y="100" width="530" height="172" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M35 143 H565" stroke="#24364b"/>
<text x="300.0" y="129" font-size="20" text-anchor="middle">Mediator policy</text>
<text x="51" y="170" font-size="17" text-anchor="start">Cached credentials require no write</text>
<text x="51" y="198" font-size="17" text-anchor="start">Load, coordinate, recheck, claim</text>
<text x="51" y="226" font-size="17" text-anchor="start">Provider HTTP call outside SQL transaction</text>
<text x="51" y="254" font-size="17" text-anchor="start">Persist outcome even after cancellation</text>
<rect x="650" y="100" width="515" height="172" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M650 143 H1165" stroke="#24364b"/>
<text x="907.5" y="129" font-size="20" text-anchor="middle">Coordinator in session package</text>
<text x="666" y="170" font-size="17" text-anchor="start">Key: stable session identity + provider</text>
<text x="666" y="198" font-size="17" text-anchor="start">Completion channel + shared error</text>
<text x="666" y="226" font-size="17" text-anchor="start">No credentials and no network lock</text>
<text x="666" y="254" font-size="17" text-anchor="start">Cookie rotation preserves sharing</text>
<path d="M565 190 L650 190" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="607.5" y="180.0" font-size="16" text-anchor="middle">enter / join</text>
<rect x="35" y="420" width="530" height="172" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M35 463 H565" stroke="#24364b"/>
<text x="300.0" y="449" font-size="20" text-anchor="middle">SQL connection claim</text>
<text x="51" y="490" font-size="17" text-anchor="start">ClaimRefresh commits refreshing = 1</text>
<text x="51" y="518" font-size="17" text-anchor="start">Private row identity + revision</text>
<text x="51" y="546" font-size="17" text-anchor="start">FinishRefresh clears marker on success</text>
<text x="51" y="574" font-size="17" text-anchor="start">DiscardConnection cannot delete a replacement</text>
<rect x="650" y="420" width="515" height="172" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M650 463 H1165" stroke="#24364b"/>
<text x="907.5" y="449" font-size="20" text-anchor="middle">Completion and recovery</text>
<text x="666" y="490" font-size="17" text-anchor="start">Each caller reloads its own cookie</text>
<text x="666" y="518" font-size="17" text-anchor="start">Logout, expiry, reconnect reject stale writes</text>
<text x="666" y="546" font-size="17" text-anchor="start">Failed persistence keeps marker unavailable</text>
<text x="666" y="574" font-size="17" text-anchor="start">Startup removes only unfinished connections</text>
<path d="M300 272 L300 420" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="300.0" y="336.0" font-size="16" text-anchor="middle">leader commits before HTTP</text>
<path d="M565 515 L650 515" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="607.5" y="505.0" font-size="16" text-anchor="middle">conditional final write</text>
</g></svg>
