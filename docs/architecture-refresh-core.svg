<text x="795" y="545" font-size="18" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">0..*</text>
<path d="M70 790 H1410 L1430 810 V934 H70 Z M1410 790 V810 H1430" fill="white" stroke="black" stroke-width="2"/>
<text x="86" y="822" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">Under lock: register one flight per provider, or join the existing flight.</text>
<text x="86" y="852" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">Outside lock: callback receives a copy; decides cached token, refresh, retention, or deletion.</text>
<text x="86" y="882" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">Under lock: check session membership, expiry, original connection identity; publish and close done.</text>
<text x="86" y="912" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">nil connection means deletion, even on error. A waiter can cancel only its own wait.</text>
</g></svg>
