<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Runtime: one exclusive SQLite owner</title><desc id="desc">The browser uses local Caddy to reach Go. Go owns a private SQLite file and calls the provider token endpoint; the browser calls resource APIs directly.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24364b" stroke-width="1.5"/></marker></defs><rect width="1200" height="700" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#15283c"><text x="600" y="42" text-anchor="middle" font-size="26" font-weight="bold">Runtime: one exclusive SQLite owner</text>
<rect x="30" y="100" width="330" height="144" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M30 143 H360" stroke="#24364b"/>
<text x="195.0" y="129" font-size="20" text-anchor="middle">Browser</text>
<text x="46" y="170" font-size="17" text-anchor="start">Frontend JavaScript</text>
<text x="46" y="198" font-size="17" text-anchor="start">Opaque HttpOnly cookie</text>
<text x="46" y="226" font-size="17" text-anchor="start">Access tokens for provider APIs</text>
<rect x="435" y="100" width="330" height="144" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M435 143 H765" stroke="#24364b"/>
<text x="600.0" y="129" font-size="20" text-anchor="middle">Local Caddy</text>
<text x="451" y="170" font-size="17" text-anchor="start">HTTPS browser boundary</text>
<text x="451" y="198" font-size="17" text-anchor="start">One forwarded client IP</text>
<text x="451" y="226" font-size="17" text-anchor="start">Go listener on loopback</text>
<rect x="840" y="100" width="330" height="144" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M840 143 H1170" stroke="#24364b"/>
<text x="1005.0" y="129" font-size="20" text-anchor="middle">OAuth provider</text>
<text x="856" y="170" font-size="17" text-anchor="start">Authorization endpoint</text>
<text x="856" y="198" font-size="17" text-anchor="start">Token endpoint</text>
<text x="856" y="226" font-size="17" text-anchor="start">Resource API</text>
<rect x="435" y="390" width="330" height="144" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M435 433 H765" stroke="#24364b"/>
<text x="600.0" y="419" font-size="20" text-anchor="middle">Go process</text>
<text x="451" y="460" font-size="17" text-anchor="start">main + mediator.Server</text>
<text x="451" y="488" font-size="17" text-anchor="start">session.Store + cleanup</text>
<text x="451" y="516" font-size="17" text-anchor="start">Drain handlers before DB close</text>
<rect x="30" y="390" width="330" height="144" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M30 433 H360" stroke="#24364b"/>
<text x="195.0" y="419" font-size="20" text-anchor="middle">SQLite file</text>
<text x="46" y="460" font-size="17" text-anchor="start">database_path, mode 0600</text>
<text x="46" y="488" font-size="17" text-anchor="start">New directories: mode 0700</text>
<text x="46" y="516" font-size="17" text-anchor="start">One process; exclusive lock</text>
<path d="M360 175 L435 175" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="397.5" y="165.0" font-size="16" text-anchor="middle">HTTPS</text>
<path d="M600 244 L600 390" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="307.0" font-size="16" text-anchor="middle">loopback HTTP</text>
<path d="M435 470 L360 470" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="397.5" y="460.0" font-size="16" text-anchor="middle">SQL transactions</text>
<path d="M765 470 L1005 244" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="885.0" y="347.0" font-size="16" text-anchor="middle">exchange / refresh</text>
<path d="M195 100 V80 H1005 V100" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600" y="70" font-size="16" text-anchor="middle">navigate / direct resource API calls</text>
<text x="600" y="650" font-size="17" text-anchor="middle">Committed sessions survive restarts. Unfinished refresh connections require reconnection.</text>
</g></svg>
