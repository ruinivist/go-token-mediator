<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="927" viewBox="0 0 1200 927" role="img" aria-labelledby="title desc"><title id="title">Refresh: commit claim before provider work</title><desc id="desc">Time runs downward. Waiters share the operation and can cancel their own wait independently. Final persistence uses a separate five-second context after browser cancellation. Failed final writes leave credentials marked unavailable; startup removes that connection.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24364b" stroke-width="1.5"/></marker></defs><rect width="1200" height="927" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#15283c"><text x="600" y="42" text-anchor="middle" font-size="26" font-weight="bold">Refresh: commit claim before provider work</text>
<text x="70.0" y="95" font-size="18" text-anchor="middle">Caller A</text>
<path d="M70.0 115 V768" stroke="#a5b2bf" stroke-dasharray="5 5"/>
<text x="423.3333333333333" y="95" font-size="18" text-anchor="middle">Mediator</text>
<path d="M423.3333333333333 115 V768" stroke="#a5b2bf" stroke-dasharray="5 5"/>
<text x="776.6666666666666" y="95" font-size="18" text-anchor="middle">SQLite store</text>
<path d="M776.6666666666666 115 V768" stroke="#a5b2bf" stroke-dasharray="5 5"/>
<text x="1130.0" y="95" font-size="18" text-anchor="middle">Provider</text>
<path d="M1130.0 115 V768" stroke="#a5b2bf" stroke-dasharray="5 5"/>
<path d="M70.0 155 L423.3333333333333 155" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="246.66666666666666" y="145.0" font-size="16" text-anchor="middle">POST token with cookie</text>
<path d="M423.3333333333333 213 L776.6666666666666 213" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="203.0" font-size="16" text-anchor="middle">LoadConnection: credentials + versioned reference</text>
<text x="423.3333333333333" y="263" font-size="15" text-anchor="middle">Enter/join stable session + provider flight</text>
<path d="M423.3333333333333 329 L776.6666666666666 329" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="319.0" font-size="16" text-anchor="middle">Leader rechecks state; ClaimRefresh</text>
<path d="M776.6666666666666 387 L423.3333333333333 387" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="377.0" font-size="16" text-anchor="middle">Committed marker + opaque claim</text>
<path d="M423.3333333333333 445 L1130.0 445" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="776.6666666666666" y="435.0" font-size="16" text-anchor="middle">Refresh outside transaction and coordination lock</text>
<path d="M1130.0 503 L423.3333333333333 503" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="776.6666666666666" y="493.0" font-size="16" text-anchor="middle">Success, rejection, or uncertain consumption</text>
<path d="M423.3333333333333 561 L776.6666666666666 561" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="551.0" font-size="16" text-anchor="middle">FinishRefresh or DiscardConnection</text>
<text x="423.3333333333333" y="611" font-size="15" text-anchor="middle">Publish shared error and close completion signal</text>
<path d="M423.3333333333333 677 L776.6666666666666 677" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600.0" y="667.0" font-size="16" text-anchor="middle">Each caller reloads with its own cookie</text>
<path d="M423.3333333333333 735 L70.0 735" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="246.66666666666666" y="725.0" font-size="16" text-anchor="middle">Access token or sanitized error</text>
<text x="600" y="808" font-size="16" text-anchor="middle">Waiters share the operation and can cancel their own wait independently.</text>
<text x="600" y="836" font-size="16" text-anchor="middle">Final persistence uses a separate five-second context after browser cancellation.</text>
<text x="600" y="864" font-size="16" text-anchor="middle">Failed final writes leave credentials marked unavailable; startup removes that connection.</text>
</g></svg>
