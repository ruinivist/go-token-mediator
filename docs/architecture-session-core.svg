<text x="868" y="272" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">~ pendingAuth: *PendingAuth</text>
<text x="868" y="302" font-size="20" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">~ connections: map[string]*Connection</text>
