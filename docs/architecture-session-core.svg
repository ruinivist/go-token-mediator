<text x="325" y="635" font-size="18" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">0..1</text>
<path d="M1250 312 l-9 15 l9 15 l9 -15 Z" fill="black" stroke="black" stroke-width="2"/>
<path d="M1250 342 L1140 650" fill="none" stroke="black" stroke-width="2"/>
<text x="1267" y="332" font-size="18" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">1</text>
<text x="1075" y="635" font-size="18" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">0..*</text>
<text x="715" y="545" font-size="18" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">pendingAuth</text>
<text x="1200" y="545" font-size="18" fill="black" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">connections[provider]</text>
<text x="750" y="940" font-size="20" fill="black" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">One store owns sessions; each session owns its attempt and provider records. Getters return copies.</text>
