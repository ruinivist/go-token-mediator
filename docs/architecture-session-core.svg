<rect x="850" y="130" width="600" height="182" fill="white" stroke="black" stroke-width="2"/>
<text x="1150.0" y="165" font-size="25" fill="#18713a" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">session.session</text>
