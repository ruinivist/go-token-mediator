<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Part 1: SQL session ownership</title><desc id="desc">A concrete store owns transactions over sessions, pending authorization, and connections. Cascading deletes preserve ownership.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#24364b" stroke-width="1.5"/></marker></defs><rect width="1200" height="660" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#15283c"><text x="600" y="42" text-anchor="middle" font-size="26" font-weight="bold">Part 1: SQL session ownership</text>
<rect x="35" y="100" width="510" height="172" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M35 143 H545" stroke="#24364b"/>
<text x="290.0" y="129" font-size="20" text-anchor="middle">session.Store</text>
<text x="51" y="170" font-size="17" text-anchor="start">One SQL connection; exclusive file ownership</text>
<text x="51" y="198" font-size="17" text-anchor="start">Lifetime and capacity configured on Open</text>
<text x="51" y="226" font-size="17" text-anchor="start">BeginAuth / LoadConnection / Logout</text>
<text x="51" y="254" font-size="17" text-anchor="start">CleanupExpired: every ten minutes</text>
<rect x="665" y="100" width="500" height="144" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M665 143 H1165" stroke="#24364b"/>
<text x="915.0" y="129" font-size="20" text-anchor="middle">SQL sessions</text>
<text x="681" y="170" font-size="17" text-anchor="start">Stable id + unique opaque cookie</text>
<text x="681" y="198" font-size="17" text-anchor="start">Absolute UTC deadline</text>
<text x="681" y="226" font-size="17" text-anchor="start">Expiry rejects access before cleanup</text>
<path d="M545 190 L665 190" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="605.0" y="180.0" font-size="16" text-anchor="middle">transactions</text>
<rect x="35" y="400" width="510" height="116" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M35 443 H545" stroke="#24364b"/>
<text x="290.0" y="429" font-size="20" text-anchor="middle">SQL pending_auth</text>
<text x="51" y="470" font-size="17" text-anchor="start">One attempt per session</text>
<text x="51" y="498" font-size="17" text-anchor="start">Provider, state, verifier, creation time</text>
<rect x="665" y="400" width="500" height="144" rx="4" fill="#f6f9fc" stroke="#24364b" stroke-width="1.5"/><path d="M665 443 H1165" stroke="#24364b"/>
<text x="915.0" y="429" font-size="20" text-anchor="middle">SQL connections</text>
<text x="681" y="470" font-size="17" text-anchor="start">One connection per session + provider</text>
<text x="681" y="498" font-size="17" text-anchor="start">Never-reused row key; revision; refresh marker</text>
<text x="681" y="526" font-size="17" text-anchor="start">Credentials and nullable token deadlines</text>
<path d="M800 244 L290 400" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="545.0" y="312.0" font-size="16" text-anchor="middle">session_id; cascade delete</text>
<path d="M1000 244 L1000 400" fill="none" stroke="#24364b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1000.0" y="312.0" font-size="16" text-anchor="middle">session_id; cascade delete</text>
<text x="600" y="615" font-size="17" text-anchor="middle">Store operations return detached values and distinct missing-state / storage errors.</text>
</g></svg>
